name: MetadataStripper
version: 1.3.0
main: com.angryguyy.metadatastripper.MetadataStripper
api-version: '1.21'
folia-supported: true

commands:
  ms:
    description: Interfaccia amministrativa di MetadataStripper
    permission: metadatastripper.admin
    usage: /ms [reload|diagnose|validate]
permissions:
  metadatastripper.admin:
    description: Allows access to MetadataStripper administration and diagnostics
    default: op
  metadatastripper.bypass:
    description: Bypasses MetadataStripper packet protection for trusted staff
    default: false